<!-- Archivo: templates/base.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliotecas Públicas Municipales de Juárez</title>
    {% load static %}    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <style>
        body {
            background-color: #2a1321;
            color: #922453;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #bebcbc;
        }

        .logo img {
            height: 100px;
        }

        .main-nav {
            display: flex;
            align-items: center;
        }

        .nav-item {
            position: relative; /* Needed for positioning the submenu */
            margin: 0 20px; /* Spacing between nav items, adjust as needed */
        }

        .nav-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 18px; /* Adjusted font size to match the image */
            padding: 10px 15px; /* Add padding for better spacing */
            display: block; /* Makes the entire area clickable */
        }

        .nav-link:hover {
            color: #ff6f61; /* Hover color */
        }

        /* Style for the "Mi Cuenta" button */
        .account-btn {
            background-color: #922453;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 25px; /* Rounded corners */
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 5px; /* Space between icon and text */
        }

        .account-btn::before {
            content: "👤"; /* Icon for the button (you can replace with an actual icon if needed) */
        }

        .account-btn:hover {
            background-color: #e65a50; /* Slightly darker on hover */
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <img src="{% static 'images/newbiblioteca.png' %}" alt="Logo">
        </div>
        <nav class="main-nav">
            <h1 class="text-3xl font-bold mb-2">Bienvenido, {{ user.get_full_name|default:user.username }}</h1>
            <!-- Botón de logout -->
            <form action="{% url 'logout' %}" method="post" class="px-4 pb-4">
                {% csrf_token %}
                <button type="submit" class="w-full bg-red-700 hover:bg-red-800 text-white py-2 px-4 rounded flex items-center justify-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                    </svg>
                    Cerrar sesión
                </button>
            </form>
        </nav>

    </header>
    <main>
        {% block content %}{% endblock %}
    </main>

</body>
</html>
